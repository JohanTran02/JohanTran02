name: Metrics
on:
  schedule: [{cron: "0 16 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
        - name: General 
          uses: lowlighter/metrics@latest
          with:
            filename: general.svg
            output_action: gist
            token: ${{ secrets.METRICS_TOKEN }}
            base: header, activity, repositories
            base_indepth: yes
            config_order: base.header, isocalender, languages, activity
            config_timezone: Europe/Stockholm
            plugin_isocalendar: yes
            plugin_isocalendar_duration: half-year
            plugin_languages: yes
            plugin_languages_analysis_timeout: 15
            plugin_languages_analysis_timeout_repositories: 7.5
            plugin_languages_colors: github
            plugin_languages_ignored: html, css, dockerfile
            plugin_languages_details: percentage
            plugin_languages_indepth: yes
            commits_authoring: firstname lastname, username, username@users.noreply.github.com
            plugin_languages_limit: 5
            plugin_languages_recent_days: 14
            plugin_languages_recent_load: 300
            plugin_activity: yes
            plugin_activity_days: 14
            plugin_activity_filter: all
            plugin_activity_limit: 5
            plugin_activity_load: 300
            plugin_activity_visibility: public
